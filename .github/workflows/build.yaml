name: Build Push And Update Kubernetes

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Project
        run: mvn clean package -DskipTests

      - name: Set Image Tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t deepakkumarl12345/springboot-app:${TAG} .

      - name: Push Docker Image
        run: docker push deepakkumarl12345/springboot-app:${TAG}

      - name: Clone Kubernetes Repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/DeepakKumarL12345/Java-Application-K8-Kubernetes.git

      - name: Update Deployment YAML
        run: |
          sed -i "s|image:.*|image: deepakkumarl12345/springboot-app:${TAG}|g" Java-Application-K8-Kubernetes/k8s/05-java-deployment.yaml

      - name: Commit and Push Changes
        run: |
          cd Java-Application-K8-Kubernetes
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Update image tag to ${TAG}" || echo "No changes to commit"
          git push origin main